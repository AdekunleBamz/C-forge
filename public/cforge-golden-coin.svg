<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">C-forge golden coin logo</title>
  <desc id="desc">A glowing golden coin crested with the cforge CFRG mark.</desc>
  <defs>
    <radialGradient id="outerGlow" cx="50%" cy="47%" r="58%">
      <stop offset="0%" stop-color="#fff8b8"/>
      <stop offset="36%" stop-color="#ffd15f"/>
      <stop offset="71%" stop-color="#a86713"/>
      <stop offset="100%" stop-color="#1d1206"/>
    </radialGradient>
    <radialGradient id="coinFace" cx="35%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#fff7c8"/>
      <stop offset="24%" stop-color="#ffd86f"/>
      <stop offset="52%" stop-color="#d99a2b"/>
      <stop offset="77%" stop-color="#8e5315"/>
      <stop offset="100%" stop-color="#3f2308"/>
    </radialGradient>
    <linearGradient id="rim" x1="215" y1="143" x2="811" y2="886" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff6b9"/>
      <stop offset="20%" stop-color="#f8c94b"/>
      <stop offset="46%" stop-color="#7d420d"/>
      <stop offset="70%" stop-color="#ffd66c"/>
      <stop offset="100%" stop-color="#5f320a"/>
    </linearGradient>
    <linearGradient id="crestFill" x1="340" y1="282" x2="703" y2="748" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffeeb0"/>
      <stop offset="30%" stop-color="#f3b83e"/>
      <stop offset="63%" stop-color="#9b5b14"/>
      <stop offset="100%" stop-color="#3e2208"/>
    </linearGradient>
    <linearGradient id="textGold" x1="287" y1="430" x2="727" y2="617" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff9cc"/>
      <stop offset="35%" stop-color="#fff0a0"/>
      <stop offset="70%" stop-color="#d58a1d"/>
      <stop offset="100%" stop-color="#6f3907"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="28" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 1 0 0.75 0 0 0.55 0 0 0 0 0.78 0 0 0 1 0"/>
      <feBlend in2="SourceGraphic" mode="screen"/>
    </filter>
    <filter id="coinShadow" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#120900" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="0" stdDeviation="30" flood-color="#ffc44d" flood-opacity="0.58"/>
    </filter>
    <filter id="emboss" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#2d1502" flood-opacity="0.58"/>
      <feDropShadow dx="0" dy="-5" stdDeviation="5" flood-color="#fff0a0" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="#080807"/>
  <circle cx="512" cy="512" r="430" fill="#e9a930" opacity="0.24" filter="url(#softGlow)"/>
  <circle cx="512" cy="512" r="374" fill="url(#outerGlow)" filter="url(#coinShadow)"/>
  <circle cx="512" cy="512" r="342" fill="url(#rim)"/>
  <circle cx="512" cy="512" r="296" fill="url(#coinFace)"/>
  <circle cx="512" cy="512" r="254" stroke="#fff1a3" stroke-opacity="0.48" stroke-width="7"/>
  <circle cx="512" cy="512" r="222" stroke="#6a390c" stroke-opacity="0.7" stroke-width="5"/>

  <g opacity="0.42">
    <path d="M204 516h616" stroke="#fff1a3" stroke-width="4" stroke-linecap="round"/>
    <path d="M512 206v612" stroke="#fff1a3" stroke-width="4" stroke-linecap="round"/>
    <path d="M283 293c112 84 342 84 458 0" stroke="#fff1a3" stroke-width="4" stroke-linecap="round"/>
    <path d="M283 731c112-84 342-84 458 0" stroke="#3c2108" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g filter="url(#emboss)">
    <path d="M512 260c72 48 150 70 240 70v190c0 136-90 250-240 308-150-58-240-172-240-308V330c90 0 168-22 240-70Z" fill="url(#crestFill)" stroke="#fff3ac" stroke-width="14" stroke-linejoin="round"/>
    <path d="M512 310c55 34 117 51 186 54v154c0 97-61 181-186 233-125-52-186-136-186-233V364c69-3 131-20 186-54Z" fill="#17110a" fill-opacity="0.42" stroke="#71400e" stroke-width="8" stroke-linejoin="round"/>
  </g>

  <g filter="url(#emboss)">
    <path d="M578 399c-35-32-82-47-132-39-82 13-142 85-134 168 8 86 83 148 169 140 45-4 85-25 113-56l-63-55c-15 17-36 28-61 31-42 4-79-27-83-70-4-42 27-80 69-86 24-4 47 4 65 20l57-53Z" fill="url(#textGold)" stroke="#fff5b8" stroke-width="10" stroke-linejoin="round"/>
    <path d="M590 394h126v68H604c-22 0-40 18-40 40v21h135v67H564v105h-80V504c0-61 45-110 106-110Z" fill="url(#textGold)" stroke="#fff5b8" stroke-width="10" stroke-linejoin="round"/>
  </g>

  <path d="M360 778c92 60 211 68 314 18" stroke="#fff1a3" stroke-width="10" stroke-linecap="round" opacity="0.34"/>
  <path d="M342 229c-84 42-142 118-165 206" stroke="#fff8cb" stroke-width="16" stroke-linecap="round" opacity="0.32"/>
  <path d="M730 244c65 39 110 94 136 163" stroke="#fff8cb" stroke-width="10" stroke-linecap="round" opacity="0.25"/>
  <text x="512" y="857" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="900" letter-spacing="5" fill="#fff0a0" stroke="#5a2b06" stroke-width="4">CFORGE</text>
</svg>
